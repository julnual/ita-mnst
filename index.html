     // ฟังก์ชันป้องกันข้อความหรือ URL ถูกตีความเป็นคำสั่ง HTML
    const escapeHtml = (value) => String(value) // แปลงข้อมูลทุกชนิดให้เป็นข้อความ
      .replaceAll('&', '&amp;')  // แปลงเครื่องหมาย & ให้เป็น HTML Entity
      .replaceAll('<', '&lt;')   // แปลงเครื่องหมาย < เพื่อไม่ให้เริ่มแท็ก HTML
      .replaceAll('>', '&gt;')   // แปลงเครื่องหมาย > เพื่อไม่ให้ปิดแท็ก HTML
      .replaceAll('"', '&quot;') // แปลงเครื่องหมาย Double Quote
      .replaceAll("'", '&#039;'); // แปลงเครื่องหมาย Single Quote

    // ฟังก์ชันสร้างไอคอนและลิงก์สำหรับเปิดไฟล์      
    const fileLink = (url) => {
    // ถ้าไม่มี URL ให้ส่งข้อความว่างกลับไป  
      if (!url) return '';
    // ถ้า URL เป็น # หมายถึงยังไม่มีไฟล์  
      if (url === '#') 
      // แสดงไอคอนไฟล์สีเทาแทนลิงก์  
      return '<span class="text-secondary" title="ยังไม่มีไฟล์"><i class="bi bi-file-earmark-x fs-4"></i></span>';
      // ถ้ามี URL จริง ให้สร้างลิงก์สำหรับเปิดไฟล์
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" aria-label="เปิดไฟล์">
        <i class="bi bi-file-earmark-pdf text-danger fs-4"></i>
      </a>`;
    };
    // ฟังก์ชันสร้างแถวทั้งหมดภายในตาราง
    const tableRows = (rows) => rows.map(([number, detail, url, isSection = false]) => { // แยกข้อมูลของแต่ละแถวออกเป็น 4 ตัวแปร
      // ถ้า isSection เป็น true ให้เพิ่มพื้นหลังสีเขียว
      const highlight = isSection ? ' class="table-success"' : '';
      // สร้าง HTML ของแถวตาราง
      return `<tr${highlight}>
        <!-- แสดงหมายเลขข้อ -->
        <th scope="row">${escapeHtml(number)}</th>
        <!-- แสดงรายละเอียด -->
        <td>${escapeHtml(detail)}</td>
        <!-- แสดงไอคอนสำหรับเปิดไฟล์ -->
        <td class="file-column">${fileLink(url)}</td>
      </tr>`;
    }).join(''); // <--รวม HTML ของทุกแถวให้เป็นข้อความเดียว

    // ฟังก์ชันสร้างเนื้อหาของแต่ละ MOIT
    const moitPanel = (moit, index) => `
      <div class="tab-pane fade ${index === 0 ? 'show active' : ''}" id="${moit.id}" role="tabpanel" aria-labelledby="${moit.id}-tab" tabindex="0">
        <section class="card">
          <h3 class="card-header h6 bg-success text-white mb-0">${escapeHtml(moit.heading)}</h3>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead><tr><th class="number-column">#</th><th>รายละเอียด</th><th class="file-column">ไฟล์</th></tr></thead>
                <tbody>${tableRows(moit.rows)}</tbody>
              </table>
            </div>
          </div>
        </section>
      </div>`;

    // ฟังก์ชันสร้าง Accordion ของแต่ละตัวชี้วัด
    const indicatorItem = (indicator, index) => {
      // สร้าง ID ของส่วนที่ใช้เปิดและปิด Accordion
      const collapseId = `collapse-${indicator.id}`;
      // สร้างปุ่มแท็บ MOIT ภายในตัวชี้วัด
      //วนสร้างปุ่มแท็บตามจำนวน MOIT ->>  (moit, moitIndex)
      const tabs = indicator.moits.map((moit, moitIndex) => `  
        <li class="nav-item" role="presentation">
          <button class="nav-link ${moitIndex === 0 ? 'active' : ''}" id="${moit.id}-tab" data-bs-toggle="tab" data-bs-target="#${moit.id}" type="button" role="tab" aria-controls="${moit.id}" aria-selected="${moitIndex === 0}">${moit.id}</button>
        </li>`).join(''); // รวมปุ่มแท็บทั้งหมดให้เป็นข้อความ HTML เดียว

      // สร้าง HTML ของตัวชี้วัดแต่ละรายการ

      return `<article class="accordion-item"> <!-- Accordion ของตัวชี้วัด -->
        <h2 class="accordion-header" id="heading-${indicator.id}">  <!-- ส่วนหัวของ Accordion -->
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="false" aria-controls="${collapseId}">  <!-- ปุ่มเปิดและปิด Accordion -->
            <i class="bi bi-chevron-double-down me-2"></i>${escapeHtml(indicator.title)} <!-- ไอคอนลูกศร --> <!-- ชื่อตัวชี้วัด escapeHtml(indicator.title) -->
          </button>
        </h2>
        <div id="${collapseId}" class="accordion-collapse collapse" aria-labelledby="heading-${indicator.id}" data-bs-parent="#indicatorAccordion">
          <div class="accordion-body">
            <div class="card">
              <div class="card-header"><ul class="nav nav-tabs card-header-tabs" role="tablist">${tabs}</ul></div>
              <div class="card-body"><div class="tab-content">${indicator.moits.map(moitPanel).join('')}</div></div>
            </div>
          </div>
        </div>
      </article>`;
    };
    // วนข้อมูลตัวชี้วัดทั้งหมดผ่านฟังก์ชัน indicatorItem
    // จากนั้นรวม HTML และนำไปแสดงในหน้าเว็บไซต์
    document.querySelector('#indicatorAccordion').innerHTML = indicators.map(indicatorItem).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
